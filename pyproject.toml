[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infer-lab"
version = "0.1.0"
description = "infer-lab：以学习为目的的 LLM 推理引擎实验仓库（框架部署 + 手搓迷你引擎，对标 nanoGPT/minGPT 的『小而完整』）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "infer-lab learners" }]
dependencies = [
    "numpy>=1.24",
    "torch>=2.2",
]

[project.optional-dependencies]
# P1 框架部署路径：transformers 后端 + OpenAI 兼容服务
framework = [
    "transformers>=4.40",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["infer_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# 骨架态（INFER_LAB_TARGET=user）下未完成的用例按 xfail 收集，.reason 会写明「待实现」
xfail_strict = false
